# Publica a Sexta-feira (versão de navegador) no GitHub Pages, para instalar no celular.
# Endereço: https://reiscaiosantil-ai.github.io/teste/
# Precisa, uma vez: Settings → Pages → Source: GitHub Actions.
name: Lumi no celular (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [claude/kobi-virtual-assistant-8xc699]
    paths: ['assistente/**', '.github/workflows/lumi-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        working-directory: assistente
        run: node --test tests/cerebro.test.js tests/util.test.js tests/organizador.test.js tests/ia-gemini.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assistente

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
