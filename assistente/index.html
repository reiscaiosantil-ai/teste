<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>Lumi</title>
<meta name="description" content="Lumi: assistente virtual que mora no topo da tela. Conversa, marca lembretes, timers, tarefas, hábitos, toca músicas e responde por voz.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="mesa" id="mesa">
  <div class="entalho" id="entalho" aria-label="Lumi: passe o mouse ou toque para abrir">
    <div class="pilula" id="pilula" role="button" tabindex="0" aria-label="Abrir o Lumi"></div>
    <div class="painel" id="painel">
      <aside class="lado" id="lado"></aside>
      <section class="principal" id="principal"></section>
    </div>
  </div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <div class="widget w-relogio"><b id="wHora">--:--</b><span id="wData"></span></div>
  <button class="widget w-agua" id="wAgua" type="button" title="Bebi um copo de água"><span class="ico">💧</span><div><b id="wAguaN">0/8</b><span>copos de água</span></div></button>
  <button class="widget w-clima" id="wClima" type="button" title="Ver o clima"><span class="ico" id="wClimaIco">🌤️</span><div><b id="wClimaT">--°</b><span id="wClimaL">toque para ver o clima</span></div></button>
  <div class="dica" id="dica"><span class="so-mouse">passe o mouse no topo ↑</span><span class="so-toque">toque no topo ↑</span><br>ou aperte <kbd>Alt</kbd>+<kbd>K</kbd> · <kbd>Alt</kbd>+<kbd>L</kbd> para falar</div>
</div>

<div class="gota" id="gota" aria-hidden="true"><i></i></div>
<input type="file" id="arquivosMusica" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script src="js/mascote.js"></script>
<script src="js/cerebro.js"></script>
<script src="js/ia.js"></script>
<script src="js/voz-google.js"></script>
<script src="js/voz-offline.js"></script>
<script src="js/frases-estudio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
