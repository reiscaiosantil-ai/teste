<style>
/* Lumi — mesa de trabalho à noite, com o entalho no topo. */
:root {
  --noite: #0B1020; --fundo: #121831; --fundo2: #1A2242; --fundo3: #232C52; --linha: rgba(180, 200, 255, .12);
  --tinta: #EEF2FF; --nevoa: #9AA5C8; --brilho: #46E3C8; --brilho-escuro: #0A2A26; --lilas: #B9C4FF; --ceu: #5AB8FF; --rosa: #FF7AB8; --alerta: #FFB340; --ouro: #FFD25A; --perigo: #FF5A6E;
  --caixa: #0E1326; --caixa2: #161D38;
  --f-titulo: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--noite); color: var(--tinta); font: 400 15px/1.5 var(--f-texto); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--tinta); }
:focus-visible { outline: 2px solid var(--brilho); outline-offset: 2px; border-radius: 8px; }
kbd { font: 500 11px var(--f-mono); background: rgba(255, 255, 255, .1); border: 1px solid var(--linha); border-radius: 5px; padding: 1px 5px; }

/* ===== mesa (modo navegador) ===== */
.mesa { position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(70% 55% at 75% 105%, #183c5a 0%, transparent 62%), radial-gradient(55% 50% at 12% 100%, #1a3f4a 0%, transparent 60%), linear-gradient(180deg, #0d1330 0%, #17204a 52%, #1f2a5a 100%); }
.mesa::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none;
  background: linear-gradient(172deg, transparent 0 36%, rgba(14, 30, 58, .9) 37%), linear-gradient(192deg, transparent 0 42%, rgba(10, 20, 44, .95) 43%); }
.widget { position: absolute; z-index: 1; border-radius: 18px; background: rgba(14, 19, 38, .78); border: 1px solid var(--linha); padding: 12px 16px; text-align: left; backdrop-filter: blur(8px); }
button.widget:hover { border-color: rgba(70, 227, 200, .45); }
.widget .ico { font-size: 24px; }
.widget span { display: block; font-size: 12px; color: var(--nevoa); }
.w-relogio { right: 3%; bottom: 7%; } .w-relogio b { display: block; font: 800 40px/1.05 var(--f-titulo); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.w-agua { left: 3%; bottom: 7%; display: flex; gap: 10px; align-items: center; } .w-agua b, .w-clima b { font: 800 22px var(--f-titulo); }
.w-clima { left: 3%; bottom: calc(7% + 78px); display: flex; gap: 10px; align-items: center; max-width: 260px; }
.dica { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); z-index: 1; font: 500 13px/1.9 var(--f-mono); color: rgba(238, 242, 255, .55); text-align: center; pointer-events: none; transition: opacity .3s; }
.mesa.usada .dica { opacity: 0; }
.so-toque { display: none; }
@media (hover: none), (pointer: coarse) { .so-mouse { display: none; } .so-toque { display: inline; } }

/* ===== entalho ===== */
.entalho { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 5; background: #000; border-radius: 0 0 20px 20px;
  width: var(--w, 180px); height: 42px; overflow: hidden;
  transition: width .5s cubic-bezier(.3, 1.25, .4, 1), height .5s cubic-bezier(.3, 1.15, .4, 1), border-radius .4s;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 0 20px rgba(70, 227, 200, .16); }
.entalho.aberto { width: min(880px, 96vw); height: min(560px, 92vh); border-radius: 0 0 30px 30px; }
.entalho.alerta { box-shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 0 26px rgba(255, 179, 64, .55); animation: alertaPulsa 1s infinite; }
@keyframes alertaPulsa { 50% { box-shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 0 6px rgba(255, 179, 64, .2); } }
.pilula { position: absolute; inset: 0 0 auto; height: 42px; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 0 16px; cursor: pointer; transition: opacity .2s; }
.entalho.aberto .pilula { opacity: 0; pointer-events: none; }
.ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--brilho); box-shadow: 0 0 10px var(--brilho); flex: none; }
.ponto.ouvindo { background: var(--perigo); box-shadow: 0 0 10px var(--perigo); animation: lmPulsa .9s infinite; }
.vivo { font: 700 13.5px var(--f-texto); color: var(--brilho); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; min-width: 0; }
.vivo .nm { color: var(--nevoa); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.vivo.trabalho { color: var(--ouro); } .vivo.trabalho .ic { display: inline-block; animation: balanca .9s ease-in-out infinite; } @keyframes balanca { 50% { transform: translateY(-2px) rotate(-12deg); } }
.vivo.ouvindo { color: var(--perigo); } .vivo.alarme { color: var(--alerta); }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; } .eq b { width: 3px; background: var(--brilho); border-radius: 2px; animation: eq .9s ease-in-out infinite; }
.eq b:nth-child(2) { animation-delay: -.3s; } .eq b:nth-child(3) { animation-delay: -.6s; } @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

.painel { position: absolute; inset: 0; display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 18px 20px 18px 14px; opacity: 0; pointer-events: none; transition: opacity .25s .12s; }
.entalho.aberto .painel { opacity: 1; pointer-events: auto; }
.lado { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-y: auto; scrollbar-width: none; }
.lado::-webkit-scrollbar { display: none; }
.eu { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; cursor: pointer; } .eu b { display: block; font: 700 16px var(--f-titulo); }
.eu small { font: 500 11px var(--f-mono); color: var(--nevoa); } .eu small.on { color: var(--brilho); }
.nivel { display: flex; align-items: center; gap: 6px; margin-top: 3px; } .nivel em { font: 800 10px var(--f-texto); font-style: normal; color: var(--ouro); }
.nivel i { width: 56px; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; display: block; } .nivel i b { display: block; height: 100%; background: linear-gradient(90deg, var(--ouro), #FF9F0A); transition: width .4s; }
.nv { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 11px; font-size: 13.5px; font-weight: 700; color: var(--nevoa); text-align: left; flex: none; }
.nv:hover { background: rgba(255, 255, 255, .06); color: var(--tinta); } .nv.on { background: rgba(70, 227, 200, .14); color: var(--brilho); }
.nv .c { margin-left: auto; font-size: 10.5px; background: rgba(255, 255, 255, .1); color: var(--tinta); padding: 1px 6px; border-radius: 8px; }

.principal { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.principal h4 { margin: 0; font: 800 21px var(--f-titulo); letter-spacing: -.02em; }
.sub { color: var(--nevoa); font-size: 12.5px; margin: 1px 0 10px; }
.rolar { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }

/* entrada de texto e voz */
.perguntar { display: flex; gap: 6px; align-items: center; background: var(--caixa); border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px; padding: 4px 4px 4px 14px; }
.perguntar:focus-within { border-color: rgba(70, 227, 200, .5); }
.perguntar input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 14px; padding: 6px 0; }
.perguntar input::placeholder { color: rgba(255, 255, 255, .38); }
.mic, .enviar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.mic { background: var(--brilho); color: #04201b; } .mic svg { width: 16px; height: 16px; }
.mic.on { background: var(--perigo); color: #fff; animation: lmPulsa 1s infinite; }
.mic[disabled] { opacity: .35; cursor: not-allowed; }
.enviar { background: rgba(255, 255, 255, .08); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { padding: 5px 10px; border-radius: 14px; background: rgba(255, 255, 255, .08); font-size: 12px; font-weight: 700; white-space: nowrap; } .chip:hover { background: rgba(70, 227, 200, .2); color: var(--brilho); }
.chip.on { background: rgba(70, 227, 200, .22); color: var(--brilho); }
.chips.em-linha { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); } .chips.em-linha::-webkit-scrollbar { display: none; }
.meio { display: flex; gap: 10px; flex: 1; min-height: 0; margin-top: 10px; }
.conversa { flex: 1; min-height: 0; overflow-y: auto; background: var(--caixa); border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }
.msg { max-width: 86%; font-size: 13.5px; line-height: 1.4; padding: 7px 11px; border-radius: 13px; white-space: pre-wrap; word-wrap: break-word; }
.msg.u { align-self: flex-end; background: rgba(70, 227, 200, .2); border-bottom-right-radius: 4px; }
.msg.k { align-self: flex-start; background: #1b2140; border-bottom-left-radius: 4px; }
.msg a { color: var(--brilho); }
.msg.nova { animation: msgEntra .28s ease-out; } .msg.u.nova { transform-origin: right bottom; } .msg.k.nova { transform-origin: left bottom; }
@keyframes msgEntra { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.conversa { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px); mask-image: linear-gradient(180deg, transparent 0, #000 14px); }
.vazio { margin: auto; color: var(--nevoa); font-size: 13px; text-align: center; }
.vazio .lumi { margin: 0 auto 8px; }
.digitando { align-self: flex-start; display: flex; gap: 4px; padding: 10px 12px; background: #1b2140; border-radius: 13px; }
.digitando i { width: 6px; height: 6px; border-radius: 50%; background: var(--nevoa); animation: dig 1s infinite; } .digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
@keyframes dig { 50% { transform: translateY(-3px); opacity: .5; } }

/* linhas genéricas */
.linha { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--caixa); border: 1px solid rgba(255, 255, 255, .07); border-radius: 12px; margin-bottom: 6px; font-size: 13.5px; font-weight: 700; }
.linha .t { flex: 1; min-width: 0; overflow-wrap: anywhere; } .linha .t small { display: block; color: var(--nevoa); font-weight: 500; font-size: 11.5px; }
.linha.feita .t { color: var(--nevoa); text-decoration: line-through; }
.linha.atrasada .t small { color: var(--alerta); }
.ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); flex: none; transition: all .15s; display: grid; place-items: center; font-size: 11px; color: #04201b; }
.ck.on { background: var(--brilho); border-color: var(--brilho); }
.ck.on::after { content: "✓"; font-weight: 900; }
.rb { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .08); font-weight: 800; flex: none; font-size: 13px; }
.rb:hover { background: rgba(255, 255, 255, .16); } .rb.mais { background: rgba(70, 227, 200, .2); color: var(--brilho); } .rb.x:hover { background: rgba(255, 90, 110, .25); color: var(--perigo); }
.barra { height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 5px; } .barra i { display: block; height: 100%; background: var(--brilho); transition: width .3s; }
.tm { font: 800 21px var(--f-titulo); font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.form input, .form select, .campo input, .campo select, .campo textarea, .form textarea { background: var(--caixa); border: 1px solid rgba(255, 255, 255, .1); border-radius: 11px; padding: 8px 11px; outline: 0; min-width: 0; }
.form input:focus, .form select:focus, .campo input:focus, .campo select:focus, .campo textarea:focus, .form textarea:focus { border-color: rgba(70, 227, 200, .55); }
.form input.grow, .form textarea { flex: 1 1 180px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 11px; background: var(--brilho); color: #04201b; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); } .btn.fantasma { background: rgba(255, 255, 255, .08); color: var(--tinta); } .btn.perigo { background: rgba(255, 90, 110, .18); color: var(--perigo); }
.secao { font: 700 11px var(--f-mono); color: var(--nevoa); text-transform: uppercase; letter-spacing: .08em; margin: 12px 2px 6px; }
.secao:first-child { margin-top: 0; }

/* mini player e player */
.mini { width: 215px; flex: none; align-self: flex-start; background: linear-gradient(160deg, #0f3a35, #0e1326 72%); border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.mini .topo { display: flex; gap: 9px; align-items: center; min-width: 0; } .capa { width: 42px; height: 42px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 17px; background: linear-gradient(140deg, #46E3C8, #1F5AA6); }
.mini b { display: block; font: 800 13px var(--f-titulo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mini small { color: var(--nevoa); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { height: 4px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; cursor: pointer; } .pbar i { display: block; height: 100%; background: var(--brilho); width: 0; }
.ctl { display: flex; gap: 8px; align-items: center; } .ctl button { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .08); font-size: 12px; }
.ctl button.pp { background: #fff; color: #000; width: 40px; height: 40px; } .mini .ctl { justify-content: space-between; } .mini .ctl button { width: 30px; height: 30px; font-size: 11px; } .mini .ctl button.pp { width: 36px; height: 36px; }
.vrow { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.vrow input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 9px; background: linear-gradient(90deg, var(--brilho) var(--p, 60%), rgba(255, 255, 255, .14) var(--p, 60%)); outline: 0; }
.vrow input::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff; } .vrow input::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #fff; }
.vrow em { font-style: normal; color: var(--nevoa); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.player { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; } .player .capa { width: 96px; height: 96px; border-radius: 16px; font-size: 36px; }
.player b { display: block; font: 800 18px var(--f-titulo); } .player .art { color: var(--nevoa); font-size: 13px; }
.faixa { cursor: pointer; } .faixa.on { border-color: rgba(70, 227, 200, .5); } .faixa.on .t { color: var(--brilho); }

/* visual */
.vitrine { display: flex; gap: 18px; align-items: center; background: radial-gradient(120% 120% at 20% 0%, #1c2a5a, var(--caixa)); border: 1px solid var(--linha); border-radius: 16px; padding: 14px 18px; margin-bottom: 10px; }
.vitrine b { font: 800 18px var(--f-titulo); }
.opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
.cor { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
.cor.on { border-color: var(--brilho); }
.ops { display: flex; flex-wrap: wrap; gap: 6px; }
.op { display: grid; justify-items: center; gap: 2px; padding: 6px 8px 5px; border-radius: 12px; background: var(--caixa); border: 1px solid rgba(255, 255, 255, .07); font-size: 11px; font-weight: 700; color: var(--nevoa); min-width: 66px; }
.op.on { border-color: var(--brilho); color: var(--brilho); background: rgba(70, 227, 200, .08); }

/* ajustes */
.campo { display: grid; gap: 4px; margin-bottom: 10px; } .campo label, .campo > span { font-size: 12.5px; color: var(--nevoa); font-weight: 700; }
.campo small { color: var(--nevoa); font-size: 11.5px; }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.chave { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 11px; background: var(--caixa); border: 1px solid rgba(255, 255, 255, .07); border-radius: 12px; margin-bottom: 6px; font-size: 13.5px; font-weight: 700; }
.chave small { display: block; color: var(--nevoa); font-weight: 500; font-size: 11.5px; }
.tog { position: relative; width: 40px; height: 23px; border-radius: 20px; background: rgba(255, 255, 255, .16); flex: none; transition: background .2s; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .2s; }
.tog.on { background: var(--brilho); } .tog.on::after { transform: translateX(17px); }
.nota-aviso { background: rgba(255, 179, 64, .08); border: 1px solid rgba(255, 179, 64, .3); border-radius: 12px; padding: 9px 12px; color: #FFD9A0; font-size: 12.5px; margin-bottom: 10px; }

/* aviso (toast) */
.aviso { position: absolute; left: 50%; top: 54px; transform: translate(-50%, -6px); z-index: 6; background: rgba(0, 0, 0, .88); border: 1px solid var(--linha); padding: 8px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; max-width: min(92vw, 520px); text-align: center; }
.aviso.on { opacity: 1; transform: translate(-50%, 0); }
.entalho.aberto ~ .aviso { top: calc(min(560px, 92vh) + 10px); }

.imagem-gerada { display: none; }

/* ===== modo desktop (Electron): só o entalho, fundo transparente ===== */
body.desktop { background: transparent; }
body.desktop .mesa { background: transparent; }
body.desktop .mesa::after, body.desktop .widget, body.desktop .dica { display: none; }
body.desktop .entalho.aberto { width: calc(100vw - 20px); height: calc(100vh - 20px); }
body.desktop .entalho.aberto ~ .aviso { top: auto; bottom: 8px; }

@media (max-width: 760px) {
  .painel { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 14px 12px 14px; gap: 10px; }
  .lado { flex-direction: row; overflow-x: auto; gap: 4px; } .eu { display: none; } .nv { white-space: nowrap; }
  .entalho.aberto { width: 100vw; height: min(640px, 88vh); border-radius: 0 0 24px 24px; }
  .meio { flex-direction: column; } .mini { width: auto; align-self: stretch; }
  .conversa { min-height: 160px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .chips::-webkit-scrollbar { display: none; }
  .w-relogio b { font-size: 32px; } .w-clima { display: none; } .grade2 { grid-template-columns: 1fr; }
  .player .capa { width: 72px; height: 72px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Spotify do computador */
.player.spotify { background: linear-gradient(150deg, rgba(30, 215, 96, .16), var(--caixa) 65%); border: 1px solid rgba(30, 215, 96, .25); border-radius: 16px; padding: 12px 14px; }
.player.spotify .capa, .mini.spotify .capa { background: #0d1a12; }
.player.spotify .eq { height: 26px; } .player.spotify .eq b { width: 5px; background: #1ED760; } .player.spotify .ctl { margin-top: 8px; }
.mini.spotify { background: linear-gradient(160deg, #0f3a22, #0e1326 72%); }
.spot-rot { display: flex; align-items: center; gap: 6px; font: 700 11px var(--f-mono); color: #1ED760; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.spot-rot svg { width: 14px; height: 14px; }
.vivo.spot { color: #1ED760; } .vivo.spot .eq b { background: #1ED760; }

/* capas de álbum */
.capa { position: relative; overflow: hidden; }
.capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa .eq.sobre { position: absolute; right: 5px; bottom: 5px; height: 14px; padding: 3px 4px; background: rgba(0, 0, 0, .62); border-radius: 6px; z-index: 1; }
.capa .eq.sobre b { width: 3px; }
.vivo .capinha { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; flex: none; }

/* Estúdio de voz */
.estudio-frase { font: 700 22px/1.35 var(--f-titulo); text-align: center; padding: 22px 18px; margin: 6px 0 8px; background: var(--caixa); border: 1px solid var(--linha); border-radius: 16px; }
.estudio-frase.feita { border-color: rgba(70, 227, 200, .45); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* ===== aba Sistema: memória, antivírus e energia ===== */
.btn.pq { padding: 4px 10px; font-size: 11.5px; border-radius: 9px; margin-left: 6px; text-transform: none; letter-spacing: 0; font-family: var(--f-texto, inherit); }
.secao .btn.pq { vertical-align: middle; }
.memtopo { margin: 2px 2px 10px; } .memtopo small { color: var(--nevoa); font-size: 12px; }
.barra-mem { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-bottom: 5px; }
.barra-mem b { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #46E3C8, #7AA8FF); transition: width .5s; }
.barra-mem.alta b { background: linear-gradient(90deg, #FFB340, #FF5A6E); }
.procs { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.proc { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 11px; background: rgba(255, 255, 255, .04); }
.proc .pn { flex: 1; min-width: 0; } .proc .pn b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc .pn small { display: block; color: var(--nevoa); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc .mb { font: 600 12.5px var(--f-mono); color: var(--tinta); white-space: nowrap; }
.tag { font: 700 10.5px var(--f-mono); padding: 3px 8px; border-radius: 8px; background: rgba(255, 255, 255, .08); color: var(--nevoa); white-space: nowrap; }
.tag.ruim { background: rgba(255, 90, 110, .18); color: var(--perigo); }
.linhas-sis { display: flex; flex-direction: column; gap: 4px; font-size: 13px; margin: 0 2px 10px; }
.dica-sis { display: block; color: var(--nevoa); font-size: 11.5px; margin: 4px 2px 10px; }
.grade-pos { display: grid; grid-template-columns: repeat(3, 34px); gap: 5px; }
.grade-pos button { height: 24px; border-radius: 7px; background: rgba(255, 255, 255, .08); border: 1px solid transparent; }
.grade-pos button.on { background: var(--brilho); } .grade-pos button:hover:not([disabled]) { border-color: var(--brilho); }
.grade-pos button[disabled] { opacity: .2; }

/* ===== onde ela fica na tela (app instalado) ===== */
body.desktop.ph-esq .entalho { left: 10px; transform: none; }
body.desktop.ph-dir .entalho { left: auto; right: 10px; transform: none; }
body.desktop.pv-baixo .entalho { top: auto; bottom: 0; border-radius: 20px 20px 0 0; }
body.desktop.pv-baixo .entalho.aberto { border-radius: 30px 30px 0 0; }
body.desktop.pv-baixo .pilula { inset: auto 0 0; }
body.desktop.pv-meio .entalho { top: 10px; border-radius: 22px; }
body.desktop.pv-meio .entalho.aberto { border-radius: 30px; }
body.desktop.pv-baixo .aviso { top: auto; bottom: 54px; }
body.desktop.pv-baixo .entalho.aberto ~ .aviso { top: 8px; bottom: auto; }
body.desktop.ph-esq .aviso, body.desktop.ph-esq .aviso.on { left: 10px; transform: none; }
body.desktop.ph-dir .aviso, body.desktop.ph-dir .aviso.on { left: auto; right: 10px; transform: none; }

/* ===== arrastando: vira uma gotinha preta que se mexe ===== */
.gota { display: none; }
body.arrastando .mesa { visibility: hidden; }
body.arrastando { cursor: grabbing; }
body.arrastando .gota { display: grid; place-items: center; position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.gota i { position: relative; width: 56px; height: 56px; background: radial-gradient(circle at 35% 30%, #2a2a2e 0, #000 55%); box-shadow: 0 8px 22px rgba(0, 0, 0, .5);
  transform: rotate(var(--ang, 0deg)) scale(var(--estica, 1), calc(2 - var(--estica, 1))); transition: transform .14s ease-out; animation: gotaMexe 1.3s ease-in-out infinite; }
.gota i::after { content: ""; position: absolute; width: 13px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .32); top: 13px; left: 15px; transform: rotate(-35deg); }
@keyframes gotaMexe {
  0%, 100% { border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; }
  33% { border-radius: 56% 44% 52% 48% / 44% 56% 46% 54%; }
  66% { border-radius: 44% 56% 58% 42% / 52% 48% 40% 60%; }
}
@media (prefers-reduced-motion: reduce) { .gota i { animation: none; border-radius: 50%; } }

/* ===== rotinas ===== */
.rotina-form { flex-wrap: wrap; }
.rotina-form textarea { flex: 1 1 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--tinta); background: rgba(255, 255, 255, .06); border: 1px solid var(--linha); border-radius: 11px; padding: 8px 10px; }
.rotina-form input { flex: 1 1 200px; }

/* ===== mascote dança quando tem música tocando ===== */
.pilula.dancando .lumi { animation: dancaLumi .55s ease-in-out infinite alternate; transform-origin: 50% 90%; }
@keyframes dancaLumi { 0% { transform: translateY(0) rotate(-7deg); } 100% { transform: translateY(-2px) rotate(7deg); } }
@media (prefers-reduced-motion: reduce) { .pilula.dancando .lumi { animation: none; } }
</style>

<body>
<div class="mesa" id="mesa">
  <div class="entalho" id="entalho" aria-label="Lumi: passe o mouse ou toque para abrir">
    <div class="pilula" id="pilula" role="button" tabindex="0" aria-label="Abrir o Lumi"></div>
    <div class="painel" id="painel">
      <aside class="lado" id="lado"></aside>
      <section class="principal" id="principal"></section>
    </div>
  </div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <div class="widget w-relogio"><b id="wHora">--:--</b><span id="wData"></span></div>
  <button class="widget w-agua" id="wAgua" type="button" title="Bebi um copo de água"><span class="ico">💧</span><div><b id="wAguaN">0/8</b><span>copos de água</span></div></button>
  <button class="widget w-clima" id="wClima" type="button" title="Ver o clima"><span class="ico" id="wClimaIco">🌤️</span><div><b id="wClimaT">--°</b><span id="wClimaL">toque para ver o clima</span></div></button>
  <div class="dica" id="dica"><span class="so-mouse">passe o mouse no topo ↑</span><span class="so-toque">toque no topo ↑</span><br>ou aperte <kbd>Alt</kbd>+<kbd>K</kbd> · <kbd>Alt</kbd>+<kbd>L</kbd> para falar</div>
</div>

<div class="gota" id="gota" aria-hidden="true"><i></i></div>
<input type="file" id="arquivosMusica" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script>
/* Lumi — mascote em SVG: uma gotinha redonda com topete luminoso.
   13 humores, 5 estilos de olho, 12 acessórios e paletas de corpo/olhos. */
(function (raiz) {
  'use strict';

  const HUMORES = {
    idle: 'Repouso', listen: 'Ouvindo', think: 'Pensando', talk: 'Falando', happy: 'Feliz', laugh: 'Rindo',
    love: 'Carinho', cool: 'Descolado', surprised: 'Surpreso', angry: 'Bravo', cry: 'Chorando', sleep: 'Dormindo', success: 'Conseguiu!',
  };
  const OLHOS = { redondo: 'Redondos', oval: 'Ovais', pixel: 'Pixel', grande: 'Grandões', traco: 'Tracinho' };
  const ACESSORIOS = {
    nenhum: 'Nenhum', festa: 'Chapéu de festa', coroa: 'Coroa', fones: 'Fones', laco: 'Laço', gorro: 'Gorro',
    natal: 'Gorro de Natal', bone: 'Boné', oculos: 'Óculos', aureola: 'Auréola', chifres: 'Chifrinhos', flor: 'Florzinha', cartola: 'Cartola',
    tiara: 'Tiara', coroaflores: 'Coroa de flores', brincos: 'Brincos', presilha: 'Presilha de coração', lacao: 'Lação',
  };
  const CORPOS = [
    ['Nuvem', '#F5F8FF', '#C7D3F7'], ['Água', '#E6FFFA', '#8FE8D6'], ['Coral', '#FFF0EA', '#FFB59A'], ['Lavanda', '#F4EEFF', '#C9B5FF'],
    ['Limão', '#FAFFE4', '#D8EA86'], ['Céu', '#EAF6FF', '#93CCFF'], ['Algodão-doce', '#FFEFF7', '#FFB0D3'], ['Noite', '#5E6580', '#30354A'], ['Mel', '#FFF7DB', '#F0C24E'],
    ['Rosé', '#FFF0F4', '#F4B3C6'], ['Lilás', '#F8F0FF', '#D7B6F4'], ['Framboesa', '#FFE9F1', '#EE7AA6'],
  ];
  const CORES_OLHO = [
    ['Tinta', '#1B1E2B'], ['Oceano', '#1F5AA6'], ['Floresta', '#1E7A4F'], ['Uva', '#5B3A9E'], ['Cacau', '#6B3F2A'], ['Rubi', '#B3264A'], ['Neon', '#46E3C8'], ['Rosa', '#D63A7F'], ['Violeta', '#7B3FC4'],
  ];
  const CABELOS = {
    nenhum: 'Sem cabelo', franja: 'Franjinha', lateral: 'Franja de lado', longo: 'Longo', chanel: 'Chanel',
    rabo: 'Rabo de cavalo', chiquinhas: 'Maria-chiquinha', coque: 'Coque', cacheado: 'Cacheado',
  };
  const CORES_CABELO = [
    ['Castanho', '#7A4A2E'], ['Preto', '#2B2633'], ['Loiro', '#E9C46A'], ['Ruivo', '#D9693A'],
    ['Rosa', '#F28DB9'], ['Lilás', '#B79AF0'], ['Azul', '#6FA8F5'], ['Branco', '#ECECF2'],
  ];
  const CHAPEUS = ['festa', 'coroa', 'gorro', 'natal', 'bone', 'cartola', 'aureola', 'lacao'];

  const L = 18.5, R = 29.5, Y = 24.5;

  function olhos(humor, estilo, c) {
    const brilho = (x, y, r = 0.9) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".9"/>`;
    const forma = (x) => {
      if (estilo === 'pixel') return `<rect x="${x - 2.3}" y="${Y - 2.7}" width="4.6" height="5.4" rx=".5" fill="${c}"/>`;
      if (estilo === 'oval') return `<ellipse cx="${x}" cy="${Y}" rx="2.2" ry="3.3" fill="${c}"/>${brilho(x - 0.8, Y - 1.4, 0.7)}`;
      if (estilo === 'grande') return `<circle cx="${x}" cy="${Y}" r="3.9" fill="${c}"/>${brilho(x - 1.3, Y - 1.5, 1.2)}${brilho(x + 1.2, Y + 1.3, 0.5)}`;
      if (estilo === 'traco') return `<rect x="${x - 2.8}" y="${Y - 0.85}" width="5.6" height="1.7" rx=".85" fill="${c}"/>`;
      return `<circle cx="${x}" cy="${Y}" r="2.9" fill="${c}"/>${brilho(x - 1, Y - 1.1)}`;
    };
    const arcoCima = (x) => `<path d="M${x - 2.8} ${Y + 1} Q${x} ${Y - 2.8} ${x + 2.8} ${Y + 1}" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    const arcoBaixo = (x) => `<path d="M${x - 2.8} ${Y - 0.6} Q${x} ${Y + 2.4} ${x + 2.8} ${Y - 0.6}" stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    const coracao = (x) => `<path d="M${x} ${Y + 2.8} l-3 -3 a1.8 1.8 0 0 1 3 -2.3 a1.8 1.8 0 0 1 3 2.3z" fill="#FF4F86"/>`;
    const estrela = (x) => `<path d="M${x} ${Y - 3.4} l1 2.2 2.4.3-1.8 1.7.5 2.4-2.1-1.2-2.1 1.2.5-2.4-1.8-1.7 2.4-.3z" fill="#FFC93C"/>`;
    switch (humor) {
      case 'happy': case 'laugh': return arcoCima(L) + arcoCima(R);
      case 'love': return coracao(L) + coracao(R);
      case 'success': return estrela(L) + estrela(R);
      case 'sleep': case 'cry': return arcoBaixo(L) + arcoBaixo(R);
      case 'cool': return `<path d="M12 21.5 h24 v2.4 q0 3.6 -4.6 3.6 h-2.6 q-3.2 0 -3.8 -3 h-2 q-.6 3 -3.8 3 h-2.6 q-4.6 0 -4.6 -3.6z" fill="#11131C"/><rect x="14" y="22.4" width="5" height="1.3" rx=".6" fill="#fff" opacity=".4"/>`;
      case 'surprised': return `<circle cx="${L}" cy="${Y}" r="3.5" fill="#fff" stroke="${c}" stroke-width="1.5"/><circle cx="${L}" cy="${Y}" r="1.3" fill="${c}"/><circle cx="${R}" cy="${Y}" r="3.5" fill="#fff" stroke="${c}" stroke-width="1.5"/><circle cx="${R}" cy="${Y}" r="1.3" fill="${c}"/>`;
      case 'angry': return forma(L) + forma(R) + `<path d="M14.5 19.6 L21.5 21.4" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/><path d="M33.5 19.6 L26.5 21.4" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`;
      case 'think': return `<g transform="translate(1 -1.4)">${forma(L)}${forma(R)}</g>`;
      default: return forma(L) + forma(R);
    }
  }

  // cílios no canto de fora de cada olho (só quando o olho aparece aberto ou fechadinho)
  function cilios(humor, estilo, c) {
    const fechado = { happy: 1, laugh: 1, sleep: -0.6, cry: -0.6 };
    if (['cool', 'love', 'success'].includes(humor) || estilo === 'traco' && !(humor in fechado)) return '';
    const raio = estilo === 'grande' ? 3.9 : estilo === 'oval' ? 2.4 : estilo === 'pixel' ? 2.5 : humor === 'surprised' ? 3.6 : 2.9;
    const dy = humor in fechado ? fechado[humor] : (estilo === 'oval' ? -2.6 : -raio * 0.62);
    const dx = humor in fechado ? 2.8 : raio * 0.8;
    const um = (x, lado) => {
      const bx = x + lado * dx, by = Y + dy;
      return [[1.9, -1.2], [1.3, -2.1], [0.4, -2.4]].map(([ax, ay], i) =>
        `<path d="M${(bx - lado * i * 0.55).toFixed(2)} ${(by - i * 0.25).toFixed(2)} l${(lado * ax).toFixed(2)} ${ay}" stroke="${c}" stroke-width=".85" stroke-linecap="round"/>`).join('');
    };
    return `<g class="lm-cilios">${um(L, -1)}${um(R, 1)}</g>`;
  }

  function boca(humor, c) {
    const s = `stroke="${c}" stroke-width="1.4" fill="none" stroke-linecap="round"`;
    switch (humor) {
      case 'talk': return `<ellipse class="lm-boca" cx="24" cy="31.2" rx="1.9" ry="1.1" fill="${c}"/>`;
      case 'laugh': case 'success': return `<path d="M20.6 30.2 Q24 35.2 27.4 30.2z" fill="${c}"/><path d="M22 32.4 Q24 33.8 26 32.4" fill="#FF7FA6"/>`;
      case 'happy': case 'love': return `<path d="M21 30.4 Q24 33.6 27 30.4" ${s}/>`;
      case 'surprised': case 'listen': return `<ellipse cx="24" cy="31.3" rx="${humor === 'listen' ? 1.1 : 1.6}" ry="${humor === 'listen' ? 1.1 : 2}" fill="${c}"/>`;
      case 'cry': return `<path d="M21.4 32.4 Q24 29.8 26.6 32.4" ${s}/>`;
      case 'angry': return `<path d="M21.6 31.6 h4.8" ${s}/>`;
      case 'sleep': return `<circle cx="24" cy="31.4" r=".9" fill="${c}"/>`;
      case 'cool': return `<path d="M22 31.2 Q24.6 32.8 26.8 30.4" ${s}/>`;
      case 'think': return `<path d="M21.6 31.6 q1.2 -1 2.4 0 t2.4 0" ${s}/>`;
      default: return `<path d="M22 30.8 Q24 32.4 26 30.8" ${s}/>`;
    }
  }

  function acessorio(a, c) {
    switch (a) {
      case 'festa': return '<path d="M18.5 12 L24 -4 L29.5 12z" fill="#FF5AA0"/><path d="M20.3 7 h7.4 M22 2.4 h4" stroke="#FFD25A" stroke-width="1.3"/><circle cx="24" cy="-4.6" r="1.9" fill="#FFD25A"/>';
      case 'coroa': return '<path d="M14.5 12 L15.5 3 L19.8 7.6 L24 1 L28.2 7.6 L32.5 3 L33.5 12z" fill="#F2C94C" stroke="#C99A1B" stroke-width=".7"/><circle cx="24" cy="7.6" r="1.3" fill="#FF4F6E"/><circle cx="18.5" cy="9.6" r=".8" fill="#5AB8FF"/><circle cx="29.5" cy="9.6" r=".8" fill="#5AB8FF"/>';
      case 'fones': return '<path d="M7.5 25 Q7.5 7 24 7 Q40.5 7 40.5 25" stroke="#2B2E3B" stroke-width="2.6" fill="none"/><rect x="3.4" y="21" width="5.6" height="10" rx="2.6" fill="#46E3C8"/><rect x="39" y="21" width="5.6" height="10" rx="2.6" fill="#46E3C8"/>';
      case 'laco': return '<path d="M33 12.5 l-5.4 -4 v8z M33 12.5 l5.4 -4 v8z" fill="#FF5AA0"/><circle cx="33" cy="12.5" r="1.7" fill="#D93A7E"/>';
      case 'gorro': return '<path d="M9.5 16 Q9.5 2.5 24 2.5 Q38.5 2.5 38.5 16z" fill="#5A7CFF"/><path d="M14 6 v9 M19 4 v11 M24 3.4 v11.6 M29 4 v11 M34 6 v9" stroke="#4A68E0" stroke-width=".9"/><rect x="8.5" y="13" width="31" height="4" rx="2" fill="#3F5BD9"/><circle cx="24" cy="1.6" r="2.6" fill="#fff"/>';

/* Lumi — cérebro local: entende pedidos em português do dia a dia e devolve uma ação.
   Sem DOM e sem rede: as ações são executadas pelo app.js. Também roda no Node (testes). */
(function (raiz) {
  'use strict';

  const UNIDADES = {
    zero: 0, um: 1, uma: 1, dois: 2, duas: 2, 'três': 3, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9,
    dez: 10, onze: 11, doze: 12, treze: 13, catorze: 14, quatorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19,
  };
  const DEZENAS = { vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 };
  const B = '(^|[^\\p{L}\\d])', F = '(?=$|[^\\p{L}\\d])';

  /** Converte números por extenso ("vinte e cinco", "meia hora") em algarismos.

      ou depois de "às" ("às sete"), para não estragar textos como "fazer uma ligação". */
  function numeros(s, restrito) {
    const ok = (str, ini, fim) => !restrito
      || /^(?:\s+e\s+meia)?\s+(?:segundos?|seg|minutos?|mins?|horas?|h|copos?|garrafas?|dias?|semanas?)(?=$|[^\p{L}])/u.test(str.slice(fim))
      || /(?:^|\s)(?:[àa]s?|pras?|para as|at[eé] as)\s$/u.test(str.slice(0, ini));

    t = t.replace(new RegExp(B + '(' + dz + ') e (' + un + ')' + F, 'giu'), (m, a, d, u, o, str) =>
      ok(str, o + a.length, o + m.length) ? a + (DEZENAS[d.toLowerCase()] + UNIDADES[u.toLowerCase()]) : m);
    t = t.replace(new RegExp(B + '(' + dz + '|cem)' + F, 'giu'), (m, a, d, o, str) =>
      ok(str, o + a.length, o + m.length) ? a + (d.toLowerCase() === 'cem' ? 100 : DEZENAS[d.toLowerCase()]) : m);

    t = t.replace(new RegExp(B + '(' + un + ')' + F, 'giu'), (m, a, u, o, str) =>

  function normalizar(texto) {

  const num = (x) => parseFloat(String(x).replace(',', '.'));

  /** Durações: "10 minutos", "1 hora e meia", "30s", "2h30". Retorna { segundos, trechos }. */
  function duracao(n) {

      case 'renomear': S.cfg.nome = a.nome; salvar(); return { texto: `Adorei! Agora meu nome é ${a.nome}. Pode me chamar de "Ei, ${a.nome}". 💚`, humor: 'love' };
      case 'usuario': S.cfg.usuario = a.nome; salvar(); return { texto: `Prazer, ${a.nome}! Vou lembrar disso. 😊`, humor: 'love' };
      case 'dormir': return { texto: 'Zzz… me chama se precisar. 😴', humor: 'sleep' };
      case 'acordar': return { texto: 'Acordei! O que manda? 😃', humor: 'surprised' };
      case 'saudacao': {
        const h = new Date().getHours(); const per = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
        return { texto: /bom dia|boa tarde|boa noite/.test(a.s || '') ? `${per}${quem}! ${pick(p.oi)}` : pick(p.oi), humor: 'happy' };
      }
      case 'como_vai': return { texto: pick(['Tô ótima, morando aqui no topo da sua tela! E você?', 'Tudo ótimo por aqui! Bateria cheia de vontade de ajudar. E aí?']), humor: 'happy' };
      case 'obrigado': return { texto: pick(['De nada! 💚', 'Sempre que precisar!', 'Imagina! Foi um prazer.']), humor: 'love' };
      case 'quem': return { texto: `Eu sou a ${nome}, sua assistente que mora no topo da tela! Marco lembretes, timers, tarefas, toco música e converso com você. 🤖`, humor: 'happy' };
      case 'carinho': return { texto: pick(['Ownn! Também gosto muito de você 💚', 'Assim eu fico sem graça! 🥰']), humor: 'love' };
      case 'ofensa': return { texto: pick(['Poxa… vou me esforçar mais. 😢', 'Ai, essa doeu. 💔']), humor: 'cry' };

      case 'desconhecido':
      default:
        if (motorCerebro() === 'cc') return perguntarClaudeCode(original);
        if (motorCerebro() === 'api') {
          return trabalhar('💭', 'Pensando', async () => {
            const hist = []; for (const m of S.chat.slice(-12)) { const role = m.q === 'u' ? 'user' : 'assistant'; if (hist.length && hist[hist.length - 1].role === role) hist[hist.length - 1].content += '\n' + m.t; else hist.push({ role, content: m.t }); }
            while (hist.length && hist[0].role !== 'user') hist.shift();
            const d = new Date();
            const sistema = `Você é ${nome}, uma assistente virtual (mulher, fale no feminino) que mora no topo da tela do computador${S.cfg.usuario ? ' de ' + S.cfg.usuario : ''}. Personalidade: ${p.desc}. ` +
              'Responda sempre em português do Brasil, com no máximo 3 frases curtas, porque a resposta pode ser lida em voz alta. Não use markdown, listas nem títulos. ' +
              'Se pedirem algo que você não consegue fazer no computador, diga isso com honestidade e sugira um comando simples como "me lembra de…", "timer de…" ou "cria uma tarefa…". ' +
              `Hoje é ${d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}, ${pad(d.getHours())}:${pad(d.getMinutes())}.` +
              (S.memoria.length ? ` O que você já sabe sobre ${S.cfg.usuario || 'o usuário'}: ${S.memoria.map((x) => x.t).join('; ')}.` : '');
            const r = await window.IA.perguntar({ chave: S.cfg.iaChave, modelo: S.cfg.iaModelo, sistema, historico: hist });
            return { texto: r.texto, humor: r.erro ? 'cry' : r.recusa ? 'think' : 'happy', erro: !!r.erro };
          });
        }
        return { texto: `${pick(p.nao)} Diga "ajuda" pra ver o que eu sei — ou conecte uma IA em Ajustes pra conversar sobre qualquer coisa.`, humor: 'think', erro: true };

  /* ================= alarmes, lembretes e timers ================= */
  let alarmeLoop = null;

    renderPilula();

  function pararAlarme() {

  }
  function verificarAgendados() {
    const agora = Date.now(); let mudou = false;
    for (const t of S.tarefas) {
      if (t.feito || t.avisado || !t.quando || t.quando > agora) continue;
      t.avisado = true; mudou = true;
      const atrasado = agora - t.quando > 5 * 60e3; // estava fechado na hora
      if (t.tipo === 'alarme') { t.feito = true; if (!atrasado) { tocarAlarme(t); notificar('⏰ Alarme', t.t); falar(`Ei${S.cfg.usuario ? ' ' + S.cfg.usuario : ''}! Hora de acordar!`); } }
      else if (t.tipo === 'lembrete') {
        t.feito = true;
        const msg = atrasado ? `Lembrete atrasado: ${t.t}` : `Ei! Lembrete: ${t.t}`;
        addChat('k', '⏰ ' + msg); aviso('⏰ ' + t.t); notificar('⏰ Lembrete', t.t); melodia(SOM_LEMBRETE); setHumor('surprised', 3000);
        if (!atrasado) { tocarAlarme(t); setTimeout(() => { if (R.alarme === t) pararAlarme(); }, 8000); }
        falar(msg);
      } else { // tarefa com horário
        aviso('✅ Hora de: ' + t.t); notificar('✅ Tarefa', t.t); if (!atrasado) { melodia(SOM_LEMBRETE); falar('Hora de: ' + t.t); }
      }
    }
    const vencidos = S.timers.filter((t) => t.fim <= agora);
    if (vencidos.length) {
      S.timers = S.timers.filter((t) => t.fim > agora); mudou = true;
      for (const t of vencidos) {
        const msg = `O timer "${t.nome}" terminou!`;
        aviso('⏰ ' + msg); notificar('⏱ Timer', msg); addChat('k', '⏱ ' + msg); melodia(SOM_TIMER); setTimeout(() => melodia(SOM_TIMER), 900);
        setHumor('surprised', 2500); ganharXp(10); falar(msg);
      }
    }
    if (S.habitos.dia !== hojeStr()) { S.habitos = { ...S.habitos, dia: hojeStr(), agua: 0, leitura: 0, exercicio: 0 }; mudou = true; }
    if (S.cfg.pausas && !S.modoJogo && agora - R.ultimaPausa > 50 * 60e3 && agora - R.ultimaAtividade < 10 * 60e3) {
      R.ultimaPausa = agora; aviso('🌿 Hora de uma pausa: alongue-se e beba água!'); notificar('🌿 Pausa', 'Alongue-se e beba um copo de água.'); falar('Que tal uma pausa? Alongue-se e beba um copo de água.'); setHumor('love', 3000);
    }
    if (mudou) { salvar(); render(); }
  }

  /* ================= Estúdio de voz (criar uma voz Piper própria) ================= */
  const EST = { ctx: null, stream: null, no: null, partes: [] };
  async function estudioAtualizar() {
    if (window.lumiDesktop && window.lumiDesktop.estudio) {
      const e = await window.lumiDesktop.estudio.estado(); R.estudio.gravadas = e.gravadas || []; R.estudio.pasta = e.pasta;
      const n = window.FRASES_ESTUDIO.length; let i = 0; while (i < n && R.estudio.gravadas.includes(i)) i++; R.estudio.i = i % n;
    }
    render();
  }
  async function estudioGravar() {
    if (R.estudio.gravando) return;
    calar();
    try {
      EST.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
      EST.ctx = new AudioContext({ sampleRate: 22050 }); EST.partes = [];

      const t = criarTimer(Math.round(min * 60), $('#timerNome').value.trim() || 'Timer'); delete R.rascunhos.timerNome; delete R.rascunhos.timerMin; aviso(`⏱ Timer "${t.nome}" iniciado`); render(); return;
    }
    if (f.id === 'formEnergia' && SIS && R.sis.energia) {
      const acao = R.sis.energia, senha = $('#senhaEnergia').value; R.sis.energia = null;
      confirmarEnergia({ acao, segundos: 30 }, senha).then((r) => { aviso(r.texto); addChat('k', r.texto); render(); if (S.cfg.voz) falar(r.texto); });
      render(); return;
    }
    if (f.id === 'formSenha' && SIS) {
      SIS.trocarSenha($('#senhaAtual').value, $('#senhaNova').value).then((x) => { aviso(x.ok ? '🔐 Senha trocada' : x.erro); if (x.ok) { R.sis.senhaPadrao = false; render(); } });
      return;
    }
    if (f.id === 'formRotina') {
      const nome = $('#rotNome').value.trim(), comandos = $('#rotCmds').value.trim(); if (!nome || !comandos) return;
      S.rotinas = S.rotinas.filter((r) => basePalavra(r.nome) !== basePalavra(nome)); S.rotinas.push({ id: uid(), nome, comandos }); salvar();
      aviso(`✅ Rotina "${nome}" salva. É só dizer "${nome}"`); delete R.rascunhos.rotNome; delete R.rascunhos.rotCmds; render(); return;
    }
    if (f.id === 'formNota') { const t = $('#novaNota').value.trim(); if (!t) return; S.notas.unshift({ id: uid(), t, ts: Date.now() }); delete R.rascunhos.novaNota; salvar(); setHumor('success', 1500); render(); return; }
    if (f.id === 'formSpotify') { const q = $('#buscaSpotify').value.trim(); if (!q) return; const url = 'https://open.spotify.com/search/' + encodeURIComponent(q); abrirLink(url); delete R.rascunhos.buscaSpotify; aviso('🎵 Abrindo o Spotify'); }
  });
  entalho.addEventListener('input', (e) => {
    const el = e.target;
    if (el.hasAttribute('data-volume')) { setVolume(Number(el.value)); el.style.setProperty('--p', S.cfg.volume + '%'); document.querySelectorAll('[data-volp]').forEach((x) => { x.textContent = S.cfg.volume + '%'; }); return; }
    if (el.id && !el.hasAttribute('data-cfg')) R.rascunhos[el.id] = el.value;
    if (el.hasAttribute('data-cfg') && el.type === 'range') { S.cfg[el.dataset.cfg] = Number(el.value); salvar(); const lab = el.previousElementSibling; if (lab) lab.textContent = lab.textContent.replace(/·\s*[\d.]+$/, '· ' + Number(el.value).toFixed(2)); }
  });
  entalho.addEventListener('change', (e) => {
    const el = e.target;
    if (el.hasAttribute('data-meta')) { S.habitos.meta = Number(el.value); S.habitos.agua = Math.min(S.habitos.agua, S.habitos.meta); salvar(); render(); return; }
    if (el.id === 'cTela' && TELA) { TELA.posicionar({ tela: Number(el.value) }).then(() => TELA.listar()).then((t) => { R.telas = t; }).catch(() => {}); return; }
    if (!el.hasAttribute('data-cfg')) return;
    const k = el.dataset.cfg; let v = el.hasAttribute('data-num') ? Number(el.value) : el.value.trim();
    if (k === 'nome') v = v || 'Lumi';
    S.cfg[k] = v; salvar();
    if (k === 'cidade') { R.lugar = null; atualizarWidgetClima(); }
    if (/^(vozMotor|gemini|cloud)/.test(k)) { avisouGoogle = false; cacheFala.clear(); for (const m in pausaMotor) delete pausaMotor[m]; }
    if (k === 'reconhecimento' || k === 'whisperModelo') { prepararWhisper(); renderPrincipal(); }
    if (k === 'vozMotor' || k === 'cerebro') renderPrincipal();
    if (k === 'vozMotor' && v === 'natural') baixarNatural();
    if (k === 'naturalVoz') falar(`Oi${S.cfg.usuario ? ' ' + S.cfg.usuario : ''}! Essa é a voz ${String(v).replace('F', '')}.`, true);
    if (k === 'ccChave') { if (CC) CC.nova(); verificarCC(); }
    if (k === 'tratamento') renderPrincipal();
    if (k === 'agendaLinks') { R.agenda = null; carregarAgenda(true).then(() => renderPrincipal()); }
    if (k === 'nome' || k === 'usuario') renderLado();
  });
  $('#arquivosMusica').addEventListener('change', (e) => { adicionarMusicas(e.target.files); e.target.value = ''; });

  /* widgets da mesa */
  $('#wAgua').addEventListener('click', () => processar('bebi um copo de água'));
  $('#wClima').addEventListener('click', () => { abrir(); processar('como está o clima?'); });

  /* teclado */
  addEventListener('keydown', (e) => {
    R.ultimaAtividade = Date.now();
    if (e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (R.aberto) fechar(); else abrir(true); }
    else if (e.altKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); abrir(); ouvir(); }
    else if (e.key === ' ' && R.aberto && R.view === 'estudio' && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); if (R.estudio.gravando) estudioParar(); else estudioGravar(); }
    else if (e.key === 'Escape') { if (R.alarme) pararAlarme(); else if (R.falando) calar(); else if (R.ouvindo && voz.rec) voz.rec.abort(); else fechar(); }
  });

  /* arrastar (app instalado): segurar o botão esquerdo num espaço vazio vira uma gotinha que segue o mouse */
  if (TELA) {
    const LADOS = ['pv-cima', 'pv-meio', 'pv-baixo', 'ph-esq', 'ph-centro', 'ph-dir'];
    TELA.aoMudar((p) => {
      R.pos = p; document.body.classList.remove(...LADOS); document.body.classList.add('pv-' + p.v, 'ph-' + p.h);
      if (R.arrastando) { R.arrastando = false; document.body.classList.remove('arrastando'); fechar(); window.lumiDesktop.mouse(false); }
      if (R.view === 'ajustes' && R.aberto) TELA.listar().then((t) => { R.telas = t; renderPrincipal(); }).catch(() => {});
    });
    const INTERATIVO = 'button, a, input, select, textarea, label, summary, [data-acao], [data-v], [data-diz], [data-spot], [data-mus], [contenteditable], .msg, .proc, .chip';
    let segurar = null;
    entalho.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || R.arrastando || e.target.closest(INTERATIVO)) return;
      const x0 = e.screenX, y0 = e.screenY, id = e.pointerId;
      const parar = () => { clearTimeout(segurar); removeEventListener('pointermove', mexeu); removeEventListener('pointerup', parar); };
      const mexeu = (ev) => { if (Math.hypot(ev.screenX - x0, ev.screenY - y0) > 6) parar(); }; // mexeu antes: é seleção de texto, não arrasto
      addEventListener('pointermove', mexeu); addEventListener('pointerup', parar);
      clearTimeout(segurar);
      segurar = setTimeout(() => { parar(); comecarArrasto(x0, y0, id); }, 260);
    });
  }
  function comecarArrasto(x, y, id) {
    R.arrastando = true; calar(); document.body.classList.add('arrastando');
    try { document.documentElement.setPointerCapture(id); } catch (_) { /* segue sem captura */ }
    TELA.arrastar('inicio');
    const gota = $('#gota');
    let ux = x, uy = y, ut = performance.now(), relaxar = null;
    const mover = (ev) => {
      const agora = performance.now(), dt = Math.max(8, agora - ut);
      const vx = (ev.screenX - ux) / dt, vy = (ev.screenY - uy) / dt; ux = ev.screenX; uy = ev.screenY; ut = agora;
      const v = Math.min(1.5, Math.hypot(vx, vy));
      if (v > 0.05) { gota.style.setProperty('--ang', (Math.atan2(vy, vx) * 180 / Math.PI).toFixed(1) + 'deg'); gota.style.setProperty('--estica', (1 + v * 0.3).toFixed(3)); }
      clearTimeout(relaxar); relaxar = setTimeout(() => gota.style.setProperty('--estica', '1'), 90);
    };
    const soltar = () => { removeEventListener('pointermove', mover); removeEventListener('pointerup', soltar); clearTimeout(relaxar); gota.style.setProperty('--estica', '1'); TELA.arrastar('fim'); };
    addEventListener('pointermove', mover); addEventListener('pointerup', soltar);
  }

  /* olhos seguem o mouse; acorda quando você volta */
  addEventListener('pointermove', (e) => {
    mx = e.clientX; my = e.clientY;
    if (R.humor === 'sleep' && Date.now() - R.ultimaAtividade > 2000) setHumor('surprised', 900);
    R.ultimaAtividade = Date.now();
    if (!rafOlhar) rafOlhar = requestAnimationFrame(() => { rafOlhar = 0; M.olhar(document, mx, my); });
  }, { passive: true });

  /* relógio da mesa */
  function relogio() { const d = new Date(); $('#wHora').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; $('#wData').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' }); }

  /* app de computador (Electron) */
  if (NAT) {
    NAT.aoMudar((e) => { R.natural = e; if (R.view === 'ajustes' && R.aberto) { const a = document.activeElement; if (!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) renderPrincipal(); } });
    NAT.estado().then((e) => { R.natural = e; if (!e.pronto) { R.natural = null; baixarNatural(); } }).catch(() => {}); // baixa sozinha na primeira abertura: é a reserva de todas as vozes
  }
  if (PIPER) PIPER.vozes().then((v) => { R.piperVozes = v || []; if (!S.cfg.piperVoz && R.piperVozes[0]) S.cfg.piperVoz = R.piperVozes[0]; }).catch(() => {});
  if (WH) {
    WH.aoMudar((e) => { R.whisper = e; if (R.view === 'ajustes' && R.aberto) { const a = document.activeElement; if (!(a && /^(INPUT|SELECT)$/.test(a.tagName))) renderPrincipal(); } });
    WH.estado().then((e) => { R.whisper = e; prepararWhisper(); }).catch(() => {});
  }
  if (window.lumiDesktop && window.lumiDesktop.vozInfo) {
    window.lumiDesktop.vozInfo().then((i) => { R.vozOff = i; render(); if (S.cfg.sempreOuvindo) iniciarEscuta(); }).catch(() => { R.vozOff = { disponivel: false }; });
  }
  if (CC) CC.status(ccOp()).then((st) => { R.cc = st; render(); }).catch(() => { R.cc = { instalado: false }; });
  if (SIS) SIS.verificando().then((v) => { if (v) { R.sis.verif = v; render(); } }).catch(() => {});
  if (SPOT) { SPOT.aoMudar(receberSpotify); SPOT.estado().then(receberSpotify).catch(() => {}); }
  if (window.lumiDesktop) {
    window.lumiDesktop.aoAtalho((qual) => { if (qual === 'ouvir') { abrir(); ouvir(); } else if (R.aberto) fechar(); else abrir(true); });
  }

  /* instala como app (PWA) quando servido por http(s) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DESKTOP) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sem modo offline */ });
  }

  /* ================= início ================= */
  audio.volume = S.cfg.volume / 100;
  relogio(); setInterval(relogio, 15000);
  setInterval(tique, 1000);
  if (S.habitos.dia !== hojeStr()) { S.habitos = { ...S.habitos, dia: hojeStr(), agua: 0, leitura: 0, exercicio: 0 }; salvar(); }
  render(); verificarAgendados();
  if (S.cfg.cidade) atualizarWidgetClima();
  else if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then((p) => { if (p.state === 'granted') return previsao().then((r) => r && atualizarWidgetClima(r)); }).catch(() => { /* sem permissão */ });
  }
  if (S.cfg.sempreOuvindo && !window.lumiDesktop) iniciarEscuta();

  // para testes e depuração no console
  window.LUMI = { processar, estado: S, sessao: R, abrir, fechar, ouvir, iniciarEscuta, tirarChamado, interpretar: (t) => C.interpretar(t, { agora: Date.now(), nome: S.cfg.nome }) };
})();
</script>
</body>
</html>
